---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - automated

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - automated
